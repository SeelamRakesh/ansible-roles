- name: App Setup
  ansible.builtin.import:
   name: app_setup
   tasks_from: app_setup.yaml

- name: Nodejs Setup
  ansible.builtin.import:
   name: nodejs_setup
   tasks_from: nodejs_setup.yaml

- name: Copy Mongo Repo
  ansible.builtin.copy:
   src: mongo.repo
   dest: /etc/yum.repos.d/mongo.repo

- name: Install MondoDB
  ansible.builtin.dnf:
   name: mongodb-mongosh
   state: present

- name: check products loaded
  ansible.builtin.command: mongosh --host "{{ MONGODB_HOST }}" --quiet  --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
  register: catalogue_output

- name: Load products
  ansible.builtin.shell: mongosh --host MONGODB-SERVER-IPADDRESS </app/db/master-data.js
  when: catalogue_output.stdout | int < 0

- name: Enable and start Catalogue
  ansible.builtin.service:
   name: catalogue
   state: restarted
   enabled: true
