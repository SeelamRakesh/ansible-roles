- name: App Setup
  ansible.builtin.import_role:
   name: common
   tasks_from: app_setup.yaml

- name: Nodejs Setup
  ansible.builtin.import_role:
   name: common
   tasks_from: nodejs_setup.yaml

- name: Systemd Setup
  ansible.builtin.import_role:
   name: common
   tasks_from: systemd_setup.yaml

- name: Start User
  ansible.builtin.service:
   name: cart
   state: restarted
   enabled: true