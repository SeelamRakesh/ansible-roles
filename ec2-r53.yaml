- name: Create EC2 and R53
  hosts: local
  connection: local
  vars:
   sg_id: "sg-0e17db6ab1dfaa76a"
   ami_id: "ami-0220d79f3f480ecf5"
   domain: "rakesh.bond"
   env: "dev"
   instances: 
    - mongodb
    - catalogue
    - frontend
  tasks:
  - name: Create EC2 instance
    amazon.aws.ec2_instance:
      name: "{{ item }}-{{ env }}"
      instance_type: "t3.micro"
      security_group: "{{ sg_id }}"
      image_id: "{{ ami_id }}"
      tags:
       Name: "{{ item }}-{{ env }}"
       Component: "{{ item }}"
       Project: "roboshop"
       Environment: "{{ env }}"
    looop: "{{ instances }}"
